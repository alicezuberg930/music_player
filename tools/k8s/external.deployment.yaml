  labels:
    app.kubernetes.io/name: yukikaze-player-rabbitmq
    app.kubernetes.io/part-of: yukikaze-player
    app.kubernetes.io/component: external
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: yukikaze-player-rabbitmq
      app.kubernetes.io/component: external
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yukikaze-player-rabbitmq
        app.kubernetes.io/part-of: yukikaze-player
        app.kubernetes.io/component: external
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: yukikaze-player-secrets-dev
            - configMapRef:
                name: yukikaze-player-config-dev
