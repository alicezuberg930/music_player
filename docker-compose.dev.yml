  yukikaze_player_video_dev:
    image: yukikaze_player_video_dev:latest
    build:
      context: .
      dockerfile: services/video-service/Dockerfile.development
    restart: unless-stopped
    env_file: .env
    environment:
      - REDIS_HOST=redis
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    container_name: yukikaze_player_video
    ports:
      - "5009:5009"
    healthcheck:
      test: ["CMD-SHELL", "command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1 && curl -f http://localhost:5009/check || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    depends_on:
