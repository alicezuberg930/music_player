apiVersion: apps/v1
kind: Deployment
metadata:
  name: yukikaze-player-redis
  labels:
    app.kubernetes.io/name: yukikaze-player-redis
    app.kubernetes.io/part-of: yukikaze-player
    app.kubernetes.io/component: external
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: yukikaze-player-redis
      app.kubernetes.io/component: external
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yukikaze-player-redis
        app.kubernetes.io/part-of: yukikaze-player
        app.kubernetes.io/component: external
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: yukikaze-player-secrets-dev
            - configMapRef:
                name: yukikaze-player-config-dev
          command:
            - redis-server
            - --save
            - "60"
            - "1"
            - --loglevel
            - warning
          ports:
            - containerPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yukikaze-player-kafka
  labels:
    app.kubernetes.io/name: yukikaze-player-kafka
    app.kubernetes.io/part-of: yukikaze-player
    app.kubernetes.io/component: external
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: yukikaze-player-kafka
      app.kubernetes.io/component: external
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yukikaze-player-kafka
        app.kubernetes.io/part-of: yukikaze-player
        app.kubernetes.io/component: external
    spec:
      containers:
        - name: kafka
          image: apache/kafka:4.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: yukikaze-player-secrets-dev
            - configMapRef:
                name: yukikaze-player-config-dev
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://yukikaze-player-kafka:9092
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@yukikaze-player-kafka:9093
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
          ports:
            - containerPort: 9092
---
apiVersion: apps/v1
kind: Deployment
metadata:
