services:
  yukikaze_player_db:
    image: mysql:9
    container_name: yukikaze_player_db
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_PORT=${MYSQL_PORT}
      - MYSQL_SSL_MODE=${MYSQL_SSL_MODE}
      - MYSQL_USER=${MYSQL_USER}
    env_file: .env
    ports:
      - "3306:3306"
    volumes:
      - yukikaze_player_db_data:/var/lib/mysql/data

  yukikaze_player_app_prod:
    build: 
      context: .
      dockerfile: apps/web/Dockerfile.production
      args:
        VITE_API_URL: ${VITE_API_URL}
        WEB_PORT: ${WEB_PORT}
    container_name: yukikaze_player_app_prod
    ports:
      - "5173:5173"
    restart: unless-stopped
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5173/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    depends_on:
      yukikaze_player_song_prod:
        condition: service_healthy
      yukikaze_player_home_prod:
        condition: service_healthy
      yukikaze_player_notification_prod:
        condition: service_healthy
      yukikaze_player_gateway_prod:
        condition: service_healthy
      yukikaze_player_artist_prod:
        condition: service_healthy
      yukikaze_player_auth_prod:
        condition: service_healthy
      yukikaze_player_playlist_prod:
        condition: service_healthy
      yukikaze_player_banner_prod:
        condition: service_healthy
      yukikaze_player_user_prod:
        condition: service_healthy
      # yukikaze_player_db:
      #   condition: service_healthy

  yukikaze_player_song_prod:
    build:
      context: .
      dockerfile: services/song-service/Dockerfile.production
    restart: unless-stopped
    env_file: .env
    environment:
      - REDIS_HOST=redis
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    container_name: yukikaze_player_song_prod
    ports:
      - "5003:5003"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5003/check || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    depends_on:
      yukikaze_player_gateway_prod:
        condition: service_healthy

  yukikaze_player_home_prod:
    build:
      context: .
      dockerfile: services/home-service/Dockerfile.production
    restart: unless-stopped
    env_file: .env
    ports:
      - "5001:5001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5001/check || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    depends_on:
      yukikaze_player_gateway_prod:
        condition: service_healthy

  yukikaze_player_notification_prod:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile.production
    restart: unless-stopped
    env_file: .env
    container_name: yukikaze_player_notification_prod
    ports:
      - "5009:5009"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5009/check || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    depends_on:
      yukikaze_player_gateway_prod:
        condition: service_healthy

  yukikaze_player_gateway_prod:
    build:
      context: .
      dockerfile: services/gateway-service/Dockerfile.production
    restart: unless-stopped
    env_file: .env
    environment:
      - HOME_SERVICE_HOST=yukikaze_player_home_prod
      - NOTIFICATION_SERVICE_HOST=yukikaze_player_notification_prod
      - AUTH_SERVICE_HOST=yukikaze_player_auth_prod
      - SONG_SERVICE_HOST=yukikaze_player_song_prod
      - BANNER_SERVICE_HOST=yukikaze_player_banner_prod
      - ARTIST_SERVICE_HOST=yukikaze_player_artist_prod
      - PLAYLIST_SERVICE_HOST=yukikaze_player_playlist_prod
      - USER_SERVICE_HOST=yukikaze_player_user_prod
    container_name: yukikaze_player_gateway_prod
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/check || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  yukikaze_player_artist_prod:
    build:
      context: .
      dockerfile: services/artist-service/Dockerfile.production
    restart: unless-stopped
    env_file: .env
    environment:
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    container_name: yukikaze_player_artist_prod
    ports:
      - "5004:5004"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5004/check || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    depends_on:
      yukikaze_player_gateway_prod:
        condition: service_healthy

  yukikaze_player_auth_prod:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile.production
    restart: unless-stopped
    env_file: .env
    container_name: yukikaze_player_auth_prod
    ports:
      - "5002:5002"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5002/check || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    depends_on:
      yukikaze_player_gateway_prod:
        condition: service_healthy

  yukikaze_player_banner_prod:
    build:
      context: .
      dockerfile: services/banner-service/Dockerfile.production
    restart: unless-stopped
    env_file: .env
    environment:
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    container_name: yukikaze_player_banner_prod
    ports:
      - "5005:5005"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5005/check || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    depends_on:
      yukikaze_player_gateway_prod:
        condition: service_healthy

  yukikaze_player_playlist_prod:
    build:
      context: .
      dockerfile: services/playlist-service/Dockerfile.production
    restart: unless-stopped
    env_file: .env
    environment:
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    container_name: yukikaze_player_playlist_prod
    ports:
      - "5007:5007"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5007/check || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    depends_on:
      yukikaze_player_gateway_prod:
        condition: service_healthy

  yukikaze_player_user_prod:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile.production
    restart: unless-stopped
    env_file: .env
    container_name: yukikaze_player_user_prod
    ports:
      - "5006:5006"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5006/check || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    depends_on:
      yukikaze_player_gateway_prod:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3-management
    container_name: yukikaze_player_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: redis:7-alpine
    container_name: yukikaze_player_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    volumes:
      - yukikaze_player_redis_data:/data

  kafka:
    image: apache/kafka:4.1.0
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data

volumes:
  yukikaze_player_redis_data:
    driver: local
  yukikaze_player_db_data:
    driver: local
  kafka_data: