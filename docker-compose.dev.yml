services:
  yukikaze_player_db:
    image: mysql:9
    container_name: yukikaze_player_db
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_PORT=${MYSQL_PORT}
      - MYSQL_SSL_MODE=${MYSQL_SSL_MODE}
      - MYSQL_USER=${MYSQL_USER}
    env_file: .env
    ports:
      - "3306:3306"
    volumes:
      - yukikaze_player_db_data:/var/lib/mysql/data

  yukikaze_player_app_dev:
    image: yukikaze_player_app_dev:latest
    build: 
      context: .
      dockerfile: apps/web/Dockerfile.development
      args:
        VITE_API_URL: ${VITE_API_URL}
        WEB_PORT: ${WEB_PORT}
    container_name: yukikaze_player_app
    ports:
      - "5173:5173"
    restart: unless-stopped
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5173/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    depends_on:
      yukikaze_player_song_dev:
        condition: service_healthy
      yukikaze_player_home_dev:
        condition: service_healthy
      yukikaze_player_notification_dev:
        condition: service_healthy
      yukikaze_player_video_dev:
        condition: service_healthy
      yukikaze_player_social_dev:
        condition: service_healthy
      yukikaze_player_gateway_dev:
        condition: service_healthy
      yukikaze_player_artist_dev:
        condition: service_healthy
      yukikaze_player_auth_dev:
        condition: service_healthy
      yukikaze_player_playlist_dev:
        condition: service_healthy
      yukikaze_player_banner_dev:
        condition: service_healthy
      yukikaze_player_user_dev:
        condition: service_healthy
      # yukikaze_player_db:
      #   condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./apps/web/src
          target: /app/apps/web/src
          ignore:
            - node_modules/
        - action: rebuild
          path: ./apps/web/package.json
        - action: sync
          path: ./packages
          target: /app/packages
          ignore:
            - node_modules/

  yukikaze_player_song_dev:
    image: yukikaze_player_song_dev:latest
    build:
      context: .
      dockerfile: services/song-service/Dockerfile.development
    restart: unless-stopped
    env_file: .env
    environment:
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    container_name: yukikaze_player_song
    ports:
      - "5003:5003"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5003/check || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    depends_on:
      yukikaze_player_gateway_dev:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./services/song-service/src
          target: /app/services/song-service/src
          ignore:
            - node_modules/
        - action: rebuild
          path: ./services/song-service/package.json
        - action: sync
          path: ./packages
          target: /app/packages
          ignore:
            - node_modules/

