services:
  yukikaze_player_services:
    build:
      context: .
      dockerfile: Dockerfile.services
    image: yukikaze_player_services
    container_name: yukikaze_player_services
    working_dir: /app
    env_file: .env
    environment:
      HOME_SERVICE_HOST: 127.0.0.1
      AUTH_SERVICE_HOST: 127.0.0.1
      SONG_SERVICE_HOST: 127.0.0.1
      BANNER_SERVICE_HOST: 127.0.0.1
      ARTIST_SERVICE_HOST: 127.0.0.1
      USER_SERVICE_HOST: 127.0.0.1
      PLAYLIST_SERVICE_HOST: 127.0.0.1
      GENRE_SERVICE_HOST: 127.0.0.1
      VIDEO_SERVICE_HOST: 127.0.0.1
    restart: unless-stopped
    ports:
      - "5000:5000"
    # command: >
    #   bun run build:services && bun run start:services
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"const r = await fetch('http://127.0.0.1:5000/check'); process.exit(r.ok ? 0 : 1)\""]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 20s

  yukikaze_player_services_clean_reinstall:
    image: oven/bun:1-alpine
    container_name: yukikaze_player_services_clean_reinstall
    working_dir: /app
    env_file: .env
    volumes:
      - .:/app
      - yukikaze_player_services_node_modules:/app/node_modules
    command: >
      sh -lc '
        set -eu
        rm -rf .turbo .bun /tmp/bun
        find /app/node_modules -mindepth 1 -maxdepth 2 -exec rm -rf {} +
        find services -mindepth 1 -maxdepth 1 -type d -name "*-service" \
          -exec sh -c "rm -rf \"$0/node_modules\" \"$0/.turbo\" \"$0/dist\" \"$0/.cache\"" {} \;
        bun install --frozen-lockfile
      '
    profiles:
      - maintenance
