services:
  - type: web
    name: yukikaze-player-services
    runtime: docker
    dockerfilePath: ./Dockerfile.services
    dockerContext: .
    healthCheckPath: /check

    envVars:
      # Public gateway configuration
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: GATEWAY_PORT
        value: "5000"

      # All internal services run in this same container.
      - key: HOME_SERVICE_HOST
        value: 127.0.0.1
      - key: AUTH_SERVICE_HOST
        value: 127.0.0.1
      - key: SONG_SERVICE_HOST
        value: 127.0.0.1
      - key: BANNER_SERVICE_HOST
        value: 127.0.0.1
      - key: ARTIST_SERVICE_HOST
        value: 127.0.0.1
      - key: PLAYLIST_SERVICE_HOST
        value: 127.0.0.1
      - key: USER_SERVICE_HOST
        value: 127.0.0.1
      - key: GENRE_SERVICE_HOST
        value: 127.0.0.1

      # Copy these port values from your local .env when Render prompts you.
      - key: HOME_SERVICE_PORT
        sync: false
      - key: AUTH_SERVICE_PORT
        sync: false
      - key: SONG_SERVICE_PORT
        sync: false
      - key: BANNER_SERVICE_PORT
        sync: false
      - key: ARTIST_SERVICE_PORT
        sync: false
      - key: PLAYLIST_SERVICE_PORT
        sync: false
      - key: USER_SERVICE_PORT
        sync: false
      - key: GENRE_SERVICE_PORT
        sync: false

      # Authentication
      - key: ACCESS_TOKEN_SECRET
        sync: false
      - key: ACCESS_TOKEN_EXPIRES_IN
        value: "86400"
      - key: REFRESH_TOKEN_SECRET
        sync: false
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: "2592000"
      - key: ALLOW_CORS_WITHOUT_ORIGIN
        sync: false

      # MySQL
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        sync: false
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_SSL_MODE
        sync: false

      # Redis
      - key: REDIS_URL
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_MAX_CONNECTION_RETRY
        sync: false
      - key: REDIS_MIN_CONNECTION_DELAY_IN_MS
        sync: false
      - key: REDIS_MAX_CONNECTION_DELAY_IN_MS
        sync: false

      # Cloudinary uploads
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Transactional email
      - key: RESEND_API_KEY
        sync: false

      # Google OAuth
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false

      # Facebook OAuth
      - key: FACEBOOK_CLIENT_ID
        sync: false
      - key: FACEBOOK_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_REDIRECT_URI
        sync: false
